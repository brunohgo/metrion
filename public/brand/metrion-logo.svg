<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Metrion</title>
  <desc id="desc">Metrion, precisão que transforma resultados</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#f45100"/>
    </linearGradient>
  </defs>

  <!-- Orbit rings from the supplied reference logo -->
  <path d="M34 157c29-69 113-119 205-127 57-5 102 7 119 31" fill="none" stroke="url(#orange)" stroke-width="9" stroke-linecap="round"/>
  <path d="M356 174c-70 29-170 36-247 16-43-11-71-31-81-56" fill="none" stroke="url(#orange)" stroke-width="9" stroke-linecap="round"/>

  <!-- Angular M symbol -->
  <path d="M92 153 119 66h32l47 57 48-57h32l-29 87h-39l14-48-35 42h-20l-35-42-15 48z" fill="url(#orange)"/>

  <!-- White wordmark for the dark website -->
  <g fill="#fff" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-4">
    <text x="272" y="153" font-size="102">etri</text>
    <text x="708" y="153" font-size="102">n</text>
  </g>

  <!-- Target-shaped o from the reference -->
  <circle cx="650" cy="120" r="42" fill="none" stroke="#fff" stroke-width="16"/>
  <path d="M650 78v23M650 139v23M608 120h23M669 120h23" stroke="#ff6a00" stroke-width="5" stroke-linecap="round"/>
  <circle cx="650" cy="120" r="11" fill="#ff6a00"/>
  <circle cx="650" cy="55" r="11" fill="url(#orange)"/>
</svg>
